# Stage-C ablation (A0.2): densenet121 + W-MSE whitening loss [Ermolov2021].
# Whitening forces the embedding batch to ~identity covariance -> anti-collapse by construction
# (a different mechanism from VICReg's soft covariance penalty). Added as an auxiliary term on top
# of SimSiam (method stays SimSiam). Matched baseline = densenet121 on splits_pretrain_noucsf.
#
# CONSTRAINT (documented, itself a finding): full-rank batch whitening needs batch_size > proj_dim.
# The 3D memory budget caps batch at 16, so the projector is set SMALL (proj_dim 8 < 16). This is
# how W-MSE is meant to run (small projections), but our batch cap makes it unusually tight — so
# expect whitening to be a weaker rank lever here than in W-MSE's large-batch 2D setting. The
# transferable feature_dim (256) is UNCHANGED — only the projector head is small.

# ----- data -----
data_root: BraTS2021/BraTS2021_TrainingSet
splits_file: splits/splits_pretrain_noucsf.json   # PAPER split: UPENN in, UCSF-PDGM out (889 train / 99 val)
modalities: [t1, t1ce, t2, flair]
roi_size: [128, 128, 128]
crop_mode: tumor
tumor_margin: 16
center_mode: wt_centroid
mask_out_non_tumor: true
clip_percentiles: [0.5, 99.5]
aug_preset: clinical
normalize_after_crop: true
num_workers: 12
cache_rate: 0.0

# ----- model (small projector so batch(16) > proj_dim(8): required for whitening) -----
backbone: densenet121
feature_dim: 256                 # LOCKED transferable dim — unchanged
proj_dim: 8                      # < batch_size (16) so the batch covariance is full-rank
proj_hidden_dim: 512
pred_hidden_dim: 128

# ----- optimization -----
optimizer: sgd
base_lr: 0.05
weight_decay: 1.0e-4
momentum: 0.9
epochs: 200
batch_size: 16
warmup_epochs: 10
fix_pred_lr: true
amp: true
grad_clip: 1.0

# ----- W-MSE whitening (THIS is what differs from the baseline) -----
wmse_weight: 1.0                 # sweep centre; balance so w·wmse ~ |simsiam loss| ~ 1 (see L10 pattern)
wmse_eps: 1.0e-3

# ----- run -----
out_dir: checkpoints/simsiam_densenet121_wmse
seed: 42
save_every: 20
log_every: 10
resume: null

# ----- label-free validation monitoring -----
val_every: 1
min_delta_rankme: 0.05
best_val_loss_max: -0.8
best_align_max: 0.15
early_stop: true
patience: 15
min_epochs: 50
collapse_stop: true
collapse_patience: 3
z_std_min: 0.01
rankme_min: 5.0
pr_min: 5.0

# ----- experiment tracking -----
mlflow: true
mlflow_experiment: simsiam-brats-ablation
