# SimSiam SSL pretraining config for BraTS 2021 (T1, T1ce, T2, FLAIR).
# Every key here can be overridden on the command line, e.g.
#   python -m braintumor_ssl.train_simsiam --config configs/simsiam_brats.yaml --epochs 200 --batch_size 16

# ----- data -----
data_root: BraTS2021/BraTS2021_TrainingSet   # scanned recursively for subject folders
splits_file: splits/splits.json              # produced by make_splits.py
modalities: [t1, t1ce, t2, flair]            # channel order fed to the encoder (4 channels)
roi_size: [96, 96, 96]                       # patch size; pick data-driven size via adaptive_crop.py
crop_mode: brain                             # brain | tumor | tumor_margin (seg used only to locate the crop)
tumor_margin: 16                             # voxels of context around the WT bbox (crop_mode=tumor_margin)
center_mode: wt_centroid                     # wt_centroid | bbox_center (tumor mode)
mask_out_non_tumor: false                    # tumor modes: zero out non-tumour voxels inside the crop
clip_percentiles: [0.5, 99.5]                # foreground intensity clip before z-score (null to disable)
aug_preset: auto                             # standard | gentle | auto (gentle geometry when masked)
normalize_after_crop: false                  # true = z-score on the (masked) ROI (notebook order); false = whole brain
num_workers: 8
cache_rate: 0.0                              # >0 caches decoded volumes in RAM (needs memory)

# ----- model -----
backbone: resnet18        # resnet18/resnet34 (512-d) | resnet50 (2048-d) | densenet121 (1024-d)
feature_dim: 256          # dim of the transferable representation h (docx: "Hasta x 256 Features")
proj_dim: 256             # SimSiam projector output (z)
proj_hidden_dim: 512      # projector hidden width
pred_hidden_dim: 128      # predictor bottleneck width

# ----- optimization -----
optimizer: sgd            # sgd (SimSiam paper) | adamw
base_lr: 0.05             # LR is scaled linearly: lr = base_lr * batch_size / 256
weight_decay: 1.0e-4
momentum: 0.9
epochs: 200
batch_size: 16
warmup_epochs: 10
fix_pred_lr: true         # keep predictor LR constant (SimSiam paper appendix)
amp: true                 # mixed precision (only used on CUDA)
grad_clip: 0.0            # >0 clips grad-norm; cheap insurance for early-iteration spikes

# ----- run -----
out_dir: checkpoints/simsiam_brats
seed: 42
save_every: 20            # epochs between periodic checkpoints
log_every: 10             # iterations between console logs
resume: null              # path to checkpoint to resume from

# ----- label-free validation monitoring (optional) -----
# val_every > 0 evaluates the split's val subjects every N epochs (loss + RankMe / z_std /
# participation / alignment / uniformity), appends metrics.csv, and saves best.pth by RankMe
# *among converged epochs*. It never changes the training trajectory or last.pth. early_stop /
# collapse_stop are opt-in.
val_every: 1             # 0 = off; validate every epoch (RankMe + LiDAR + alpha-ReQ)
min_delta_rankme: 0.05    # min RankMe gain that counts as an improvement (best.pth / patience)
best_val_loss_max: -0.8   # best.pth convergence gate: eligible only if val_loss <= this ...
best_align_max: 0.15      # ... AND alignment <= this (RankMe peaks at random init; this blocks it)

# ----- optional VICReg-style regularizer (off by default) -----
# Adds variance + covariance terms on the projector embeddings to counter dimensional collapse
# [Bardes2022]. 0 = pure SimSiam (unchanged). Turn on for the Stage-C ablation (see tasks/todo.md).
vicreg_var: 0.0           # variance-hinge weight (typical VICReg: ~25 with the invariance term at 25)
vicreg_cov: 0.0           # covariance weight (typical VICReg: ~1)
vicreg_gamma: 1.0         # target per-dim std for the variance hinge
# W-MSE whitening loss [Ermolov2021]; 0 = off. Needs proj_dim < batch_size for full-rank batch
# whitening (with batch 16 -> use a small projector, e.g. proj_dim 8; see simsiam_densenet121_wmse.yaml).
wmse_weight: 0.0
wmse_eps: 1.0e-3          # shrinkage on the whitening covariance (Cholesky stability)
early_stop: false         # stop once RankMe plateaus for `patience` evals (only after min_epochs)
patience: 20
min_epochs: 50
collapse_stop: false      # stop after `collapse_patience` collapsed evals in a row
collapse_patience: 3
z_std_min: 0.01           # collapse thresholds (auto-relaxed to tiny values when val < 10 subjects)
rankme_min: 5.0
pr_min: 5.0

# ----- experiment tracking (optional; MLflow -> DagsHub) -----
# mlflow: true logs per-epoch metrics + figures (training_curves.png, metrics.csv). The server and
# credentials come from the ENVIRONMENT (never commit a token):
#   export MLFLOW_TRACKING_URI=https://dagshub.com/alilivanturk/IDH-Classifier.mlflow
#   export MLFLOW_TRACKING_USERNAME=<dagshub-username>
#   export MLFLOW_TRACKING_PASSWORD=<dagshub-token>
mlflow: false
mlflow_experiment: simsiam-brats
