# Stage-C ablation (A0.3): densenet121 + LARGER projector/predictor.
# Identical to the densenet121 paper baseline EXCEPT the SSL-head widths. feature_dim (the
# transferable 256-d vector) is UNCHANGED — only the projector/predictor grow. A wider projector
# is a known lever on embedding rank in SimSiam/VICReg [ChenHe2021, Bardes2022]; this tests
# whether extra head capacity alone mitigates the dimensional collapse we observed.
# Matched baseline = the densenet121 run on splits_pretrain_noucsf with the default head widths.

# ----- data -----
data_root: BraTS2021/BraTS2021_TrainingSet
splits_file: splits/splits_pretrain_noucsf.json   # PAPER split: UPENN in, UCSF-PDGM out (889 train / 99 val)
modalities: [t1, t1ce, t2, flair]
roi_size: [128, 128, 128]
crop_mode: tumor
tumor_margin: 16
center_mode: wt_centroid
mask_out_non_tumor: true
clip_percentiles: [0.5, 99.5]
aug_preset: clinical
normalize_after_crop: true
num_workers: 12
cache_rate: 0.0

# ----- model (THIS is what differs: wider projector + predictor; feature_dim stays 256) -----
backbone: densenet121
feature_dim: 256                 # LOCKED transferable dim — do not change
proj_dim: 512                    # baseline 256  -> wider embedding
proj_hidden_dim: 2048            # baseline 512  -> SimSiam-scale projector MLP
pred_hidden_dim: 512             # baseline 128  -> SimSiam-scale predictor bottleneck

# ----- optimization -----
optimizer: sgd
base_lr: 0.05
weight_decay: 1.0e-4
momentum: 0.9
epochs: 200
batch_size: 16
warmup_epochs: 10
fix_pred_lr: true
amp: true
grad_clip: 1.0

# ----- run -----
out_dir: checkpoints/simsiam_densenet121_bighead
seed: 42
save_every: 20
log_every: 10
resume: null

# ----- label-free validation monitoring -----
val_every: 5
min_delta_rankme: 0.05
best_val_loss_max: -0.8
best_align_max: 0.15
early_stop: true
patience: 15
min_epochs: 50
collapse_stop: true
collapse_patience: 3
z_std_min: 0.01
rankme_min: 5.0
pr_min: 5.0

# ----- experiment tracking -----
mlflow: true
mlflow_experiment: simsiam-brats-ablation
